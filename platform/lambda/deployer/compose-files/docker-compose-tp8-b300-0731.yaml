# docker-compose-tp8-b300-0731.yaml
# Unified tp=8 single engine + EAGLE (no PD disaggregation)
# Target: B300 8-GPU, DeepSeek-V4-Flash-0731
# Purpose: 方案 C baseline for customer validation (40K in / 1.5K out)
#
# Serves directly on port 30080 so the same bench command works across
# all three topologies (2P2D / 3P1D / tp8) without changing --base-url.
#
# Model: DeepSeek-V4-Flash-0731 (166.9 GB, built-in DSpark draft heads)

volumes:
  jitcache:

services:
  sglang-tp8:
    image: lmsysorg/sglang:v0.5.17-cu130
    runtime: nvidia
    network_mode: host
    ipc: host
    shm_size: 16g
    volumes:
      - /opt/dlami/nvme:/opt/dlami/nvme
      - jitcache:/root/.cache
    environment:
      NVIDIA_VISIBLE_DEVICES: "0,1,2,3,4,5,6,7"
      SGLANG_OPT_DEEPGEMM_MEGA_MOE_NUM_MAX_TOKENS_PER_RANK: "16384"
    restart: "no"
    command: >
      python3 -m sglang.launch_server
      --model-path /opt/dlami/nvme/models/deepseek-ai__DeepSeek-V4-Flash-0731
      --tp 8 --moe-a2a-backend megamoe --mem-fraction-static 0.85
      --trust-remote-code --cuda-graph-max-bs 64 --enable-metrics
      --speculative-algorithm EAGLE --speculative-num-steps 3
      --speculative-eagle-topk 1 --speculative-num-draft-tokens 4
      --host 0.0.0.0 --port 30080
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:30080/health"]
      interval: 60s
      timeout: 10s
      retries: 40
      start_period: 1800s
