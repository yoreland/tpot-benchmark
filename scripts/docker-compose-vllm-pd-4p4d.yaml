# docker-compose-vllm-pd-4p4d.yaml
# Round 2: vLLM PD-disaggregated 4P4D ("第一种": aim to lower TPOT).
# Target: B300 8-GPU (p6-b300.48xlarge), nvidia/DeepSeek-V4-Flash-nvfp4-DSpark.
#   - prefill engine: GPUs 0-3, TP4, kv_role=kv_producer, port 8100, side-channel 5600
#   - decode  engine: GPUs 4-7, TP4, kv_role=kv_consumer, port 8200, side-channel 5601
#   - disagg proxy on 127.0.0.1:30080 (exposes /v1/completions + /v1/chat/completions;
#     no /health of its own)
# Connected over NixlConnector (V1), DSpark speculative decoding kept on BOTH sides.
#
# Verbatim transcription of the verified `docker run` driver scripts (launch_pd.sh
# prefill/decode + start_proxy.sh) from
#   docs/run-summaries/b300-vllm-pd-4p4d-20260913-summary.md
# (vLLM 0.29.1rc1.dev9+g2671fedfc, image vllm/vllm-openai:nightly, verified
# healthy on i-07a1fb189f180ff3e 2026-09-13).
#
# Known caveats (see scripts/README-b300-launch-configs.md):
#   - MUST pin physical cards with `--gpus '"device=..."'` (device_ids below).
#     `--gpus all` overrides NVIDIA_VISIBLE_DEVICES so both TP4 engines grab
#     logical devices 0-3 and collide on physical GPUs 0-3.
#   - NIXL side-channel ports must differ: 5600 (prefill) vs 5601 (decode).
#   - fp8 KV identical on both sides (block size 256, BLHNC, DEEPSEEK_SPARSE_SWA).
#   - DSpark acceptance stats are NOT observable through the disagg proxy.
#   - bench client uses --random-range-ratio 0.0 (this nightly rejects 1.0).
#
# Usage:
#   docker compose -f docker-compose-vllm-pd-4p4d.yaml up -d
#   # ~11 min cold start; then bench the proxy on http://127.0.0.1:30080
#   #   /v1/chat/completions (proxy has no /health; check :8100 and :8200 /health).

volumes:
  hfcache:

x-common-service: &common-service
  image: vllm/vllm-openai:nightly
  runtime: nvidia
  network_mode: host
  ipc: host
  shm_size: 32g
  volumes:
    - /opt/dlami/nvme:/opt/dlami/nvme
    - hfcache:/root/.cache/huggingface
  restart: "no"

services:
  prefill:
    <<: *common-service
    environment:
      VLLM_USE_V1: "1"
      HF_HUB_OFFLINE: "1"
      VLLM_NIXL_SIDE_CHANNEL_PORT: "5600"
      UCX_TLS: "cuda_ipc,cuda_copy,tcp"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0", "1", "2", "3"]
              capabilities: ["gpu"]
    command: >
      --model /opt/dlami/nvme/models/nvidia__DeepSeek-V4-Flash-nvfp4-DSpark
      --served-model-name dsv4-nvfp4-dspark
      --tensor-parallel-size 4
      --enable-expert-parallel
      --trust-remote-code
      --kv-cache-dtype fp8
      --gpu-memory-utilization 0.90
      --max-model-len 133120
      --reasoning-parser deepseek_v4
      --tool-call-parser deepseek_v4
      --enable-auto-tool-choice
      --host 0.0.0.0
      --port 8100
      --kv-transfer-config '{"kv_connector":"NixlConnector","kv_role":"kv_producer"}'
      --speculative-config '{"method":"dspark","num_speculative_tokens":7,"draft_sample_method":"greedy"}'
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8100/health"]
      interval: 60s
      timeout: 10s
      retries: 40
      start_period: 1800s

  decode:
    <<: *common-service
    environment:
      VLLM_USE_V1: "1"
      HF_HUB_OFFLINE: "1"
      VLLM_NIXL_SIDE_CHANNEL_PORT: "5601"
      UCX_TLS: "cuda_ipc,cuda_copy,tcp"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["4", "5", "6", "7"]
              capabilities: ["gpu"]
    command: >
      --model /opt/dlami/nvme/models/nvidia__DeepSeek-V4-Flash-nvfp4-DSpark
      --served-model-name dsv4-nvfp4-dspark
      --tensor-parallel-size 4
      --enable-expert-parallel
      --trust-remote-code
      --kv-cache-dtype fp8
      --gpu-memory-utilization 0.90
      --max-model-len 133120
      --reasoning-parser deepseek_v4
      --tool-call-parser deepseek_v4
      --enable-auto-tool-choice
      --host 0.0.0.0
      --port 8200
      --kv-transfer-config '{"kv_connector":"NixlConnector","kv_role":"kv_consumer"}'
      --speculative-config '{"method":"dspark","num_speculative_tokens":7,"draft_sample_method":"greedy"}'
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8200/health"]
      interval: 60s
      timeout: 10s
      retries: 40
      start_period: 1800s

  proxy:
    <<: *common-service
    shm_size: 16g
    environment:
      NVIDIA_VISIBLE_DEVICES: ""
    depends_on:
      prefill:
        condition: service_healthy
      decode:
        condition: service_healthy
    # start_proxy.sh: the disagg proxy ships in the vLLM image at
    # examples/disaggregated/lmcache/disagg_prefill_lmcache_v1. Override the
    # image entrypoint to run it directly (front door on :30080).
    entrypoint: ["python3"]
    working_dir: /vllm-workspace/examples/disaggregated/lmcache/disagg_prefill_lmcache_v1
    command: >
      disagg_proxy_server.py
      --host 0.0.0.0 --port 30080
      --prefiller-host 127.0.0.1 --prefiller-port 8100
      --decoder-host 127.0.0.1 --decoder-port 8200
